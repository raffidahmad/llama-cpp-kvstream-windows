name: Bug report (build or run problem)
description: The build script or the prebuilt binary misbehaves.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: GPU, driver, Windows version, release zip or source build
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Command line and the last ~50 lines of output
      render: text
    validations:
      required: true
